name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# One publication per tag; a deploy must never be cancelled mid-upload
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  publish:
    name: Publish release to Maven Central
    runs-on: ubuntu-latest
    # deploy runs the full lifecycle (verify included) and waits for the
    # Central Portal to publish the validated bundle
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_TOKEN

      - name: Publish release
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
        run: ./mvnw -B -ntp deploy
