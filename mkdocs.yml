site_name: spring-struts-bridge
site_description: >-
  Struts 1 recreated on modern Spring — migrate an existing Struts 1
  application to Spring Boot by swapping the dependency.
site_url: https://ys-kalyakin.github.io/spring-struts-brigde/
repo_url: https://github.com/ys-kalyakin/spring-struts-brigde
repo_name: ys-kalyakin/spring-struts-brigde

docs_dir: docs

theme:
  name: material
  language: en
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Migration guide: MIGRATION.md
  - Tag libraries: taglibs.md
  - Configuration: configuration.md
  - Modules: modules.md
  - Security notes: security.md
  - Performance: performance.md
