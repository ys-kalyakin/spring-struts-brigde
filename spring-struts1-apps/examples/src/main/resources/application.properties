# Struts modules: the classic config/<prefix> init-params of web.xml.
# The validator module loads the alternative configurations of the classic
# application as extra config files of the same module, exactly as in the
# reference.
spring.struts1.config.exercise=/WEB-INF/exercise/struts-config.xml
spring.struts1.config.dispatch=/WEB-INF/dispatch/struts-config.xml
spring.struts1.config.upload=/WEB-INF/upload/struts-config.xml
spring.struts1.config.validator=/WEB-INF/validator/struts-config.xml,\
  /WEB-INF/validator/struts-config-bundles.xml,\
  /WEB-INF/validator/struts-config-i18nVariables.xml,\
  /WEB-INF/validator/struts-config-type.xml,\
  /WEB-INF/validator/struts-config-validwhen.xml
